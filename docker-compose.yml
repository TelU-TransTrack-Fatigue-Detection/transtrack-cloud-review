services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./records:/app/records
      - ./models:/app/models
      - ./output:/app/output
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    command: >
      celery -A app.worker.celery_app worker
      --loglevel=info
      --concurrency=${WORKER_CONCURRENCY:-0}
      --max-tasks-per-child=50
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./records:/app/records
      - ./models:/app/models
      - ./output:/app/output
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
